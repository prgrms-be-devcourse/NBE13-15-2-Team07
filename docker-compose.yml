# 모의 결제 서버 전용 MySQL (팀 MySQL 3307과 별개)
# 실행: docker compose up -d   (같은 폴더의 .env 값을 자동으로 읽음)
services:
  mock-pay-mysql:
    image: mysql:8.4
    container_name: mock-pay-mysql
    ports:
      - "${DB_PORT:-3308}:3306"            # 내 PC 포트 : 컨테이너 포트
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}   # Spring과 같은 .env 값 사용
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    volumes:
      - mock-pay-mysql-data:/var/lib/mysql
      # 컨테이너를 처음 만들 때(데이터가 비어 있을 때)만 이 폴더의 .sql을 자동 실행
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mock-pay-mysql-data:
